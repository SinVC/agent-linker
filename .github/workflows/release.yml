name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "plain=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo run --locked -- --help

      - name: Build
        run: cargo build --locked --release --bin aglink

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          cp target/release/aglink dist/linux/aglink
          cp -R skills dist/linux/skills
          chmod +x dist/linux/aglink
          tar -C dist/linux -czf "dist/aglink-${{ steps.version.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz" aglink skills
          (cd dist && sha256sum "aglink-${{ steps.version.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz" > "aglink-${{ steps.version.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz.sha256")
          cp packaging/unix/install.sh dist/aglink-installer.sh
          cp packaging/unix/uninstall.sh dist/aglink-uninstall.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/aglink-installer.sh
            dist/aglink-uninstall.sh

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.version }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "plain=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Verify
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo run --locked -- --help

      - name: Build
        run: cargo build --locked --release --bin aglink

      - name: Download pinned broker
        shell: pwsh
        env:
          BROKER_URL: ${{ vars.WIN_SYMLINKS_BROKER_URL }}
          BROKER_SHA256: ${{ vars.WIN_SYMLINKS_BROKER_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BROKER_URL)) {
            throw "Repository variable WIN_SYMLINKS_BROKER_URL is required for Windows releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:BROKER_SHA256)) {
            throw "Repository variable WIN_SYMLINKS_BROKER_SHA256 is required for Windows releases."
          }
          New-Item -ItemType Directory -Force -Path dist, dist\broker-download, dist\broker | Out-Null
          $download = Join-Path $PWD "dist\broker-download\broker.zip"
          Invoke-WebRequest -Uri $env:BROKER_URL -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:BROKER_SHA256.ToLowerInvariant()) {
            throw "Broker SHA256 mismatch. expected=$env:BROKER_SHA256 actual=$actual"
          }
          Expand-Archive -LiteralPath $download -DestinationPath dist\broker-download\expanded -Force
          $brokerExe = Get-ChildItem -Path dist\broker-download\expanded -Filter win-symlinks-broker.exe -Recurse | Select-Object -First 1
          if (-not $brokerExe) {
            throw "win-symlinks-broker.exe not found in broker archive."
          }
          Copy-Item -Path (Join-Path $brokerExe.Directory.FullName "*") -Destination dist\broker -Recurse -Force

      - name: Package
        shell: pwsh
        env:
          BROKER_URL: ${{ vars.WIN_SYMLINKS_BROKER_URL }}
          BROKER_SHA256: ${{ vars.WIN_SYMLINKS_BROKER_SHA256 }}
        run: |
          .\packaging\windows\package-windows.ps1 `
            -Version "${{ steps.version.outputs.tag }}" `
            -AglinkExe "target\release\aglink.exe" `
            -BrokerDir "dist\broker" `
            -OutDir "dist" `
            -BrokerSourceUrl "$env:BROKER_URL" `
            -BrokerSha256 "$env:BROKER_SHA256"
          .\packaging\windows\package-windows.ps1 `
            -Version "${{ steps.version.outputs.tag }}" `
            -AglinkExe "target\release\aglink.exe" `
            -BrokerDir "dist\broker" `
            -OutDir "dist" `
            -BrokerSourceUrl "$env:BROKER_URL" `
            -BrokerSha256 "$env:BROKER_SHA256" `
            -Portable
          Copy-Item packaging\windows\install.ps1 dist\aglink-installer.ps1
          Copy-Item packaging\windows\uninstall.ps1 dist\aglink-uninstall.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/*.zip
            dist/*.sha256
            dist/aglink-installer.ps1
            dist/aglink-uninstall.ps1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -maxdepth 3 -type f -exec cp {} dist/ \;
          (cd dist && sha256sum aglink-* > SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --verify-tag
